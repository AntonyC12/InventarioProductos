<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inventory Management System</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #22c55e;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 2rem;
            background: linear-gradient(to right, var(--primary), #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card {
            background: var(--card-bg);
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th {
            text-align: left;
            padding: 1rem;
            border-bottom: 2px solid var(--border);
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border);
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-sm {
            padding: 0.4rem 0.8rem;
            font-size: 0.875rem;
        }

        .stock-form {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .stock-input {
            width: 80px;
            padding: 0.4rem;
        }

        .badge {
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-success {
            background-color: #dcfce7;
            color: #166534;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Inventory Dashboard</h1>

    <div class="grid">
        <!-- Add Product Card -->
        <div class="card">
            <div class="card-title">Add New Product</div>
            <form th:action="@{/add}" th:object="${newProduct}" method="post">
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" th:field="*{name}" placeholder="e.g. Mechanical Keyboard" required>
                </div>
                <div class="form-group">
                    <label>Price ($)</label>
                    <input type="number" step="0.01" th:field="*{price}" placeholder="0.00" required>
                </div>
                <div class="form-group">
                    <label>Initial Stock</label>
                    <input type="number" th:field="*{stock}" placeholder="0" required>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Add to Inventory</button>
            </form>
        </div>

        <!-- Stats Card (Optional / Summary) -->
        <div class="card">
            <div class="card-title">Quick Summary</div>
            <div style="display: flex; flex-direction: column; gap: 1rem;">
                <div style="display: flex; justify-content: space-between; padding-bottom: 0.5rem; border-bottom: 1px dashed var(--border);">
                    <span style="color: var(--text-muted);">Total SKU types:</span>
                    <span style="font-weight: 700;" th:text="${products.size()}">0</span>
                </div>
                <div style="font-size: 0.875rem; color: var(--text-muted); line-height: 1.5;">
                    Welcome to the new Spring MVC interface. All data is persisted in real-time to the <code>inventory.txt</code> storage.
                </div>
            </div>
        </div>
    </div>

    <!-- Inventory Table Card -->
    <div class="card">
        <div class="card-title">Current Inventory</div>
        <table>
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Total Value</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="product, iterStat : ${products}">
                    <td>
                        <div style="font-weight: 600;" th:text="${product.name}">Product Name</div>
                    </td>
                    <td th:text="${'$' + #numbers.formatDecimal(product.price, 1, 2)}">$0.00</td>
                    <td>
                        <span class="badge badge-success" th:text="${product.stock + ' units'}">0 units</span>
                    </td>
                    <td style="font-weight: 600;" th:text="${'$' + #numbers.formatDecimal(product.getTotalValue(), 1, 2)}">$0.00</td>
                    <td>
                        <form th:action="@{/update-stock}" method="post" class="stock-form">
                            <input type="hidden" name="index" th:value="${iterStat.index}">
                            <input type="number" name="stock" th:value="${product.stock}" class="stock-input">
                            <button type="submit" class="btn btn-sm">Update</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${products.isEmpty()}">
                    <td colspan="5" style="text-align: center; padding: 2rem; color: var(--text-muted);">No products found in inventory.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
